<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechStore / Velaro — демо</title><style>body{background:#101018;color:#fff;font:16px system-ui;margin:0;padding:5vw}button,input{font:inherit;padding:12px;border:0;border-radius:10px}button{background:#7951ef;color:white;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(36px,7vw,80px);max-width:800px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}article{background:#222230;padding:24px;border-radius:20px}article span{font-size:65px}small{color:#aaa}dialog{background:#222230;color:white;border:0;border-radius:20px;max-width:90vw}body.fashion{background:#171510}body.fashion button{background:#806749}</style><header><b id="brand">TechStore</b><button onclick="switchShop()">Сменить магазин</button><button onclick="showCart()">Корзина (<b id="count">0</b>)</button></header><h1 id="hero">Техника для твоей жизни.</h1><p>Демонстрационный интернет-магазин</p><input id="search" placeholder="Поиск товаров" oninput="render()"><div class="grid" id="products"></div><dialog id="cart"><h2>Корзина</h2><div id="items"></div><p id="total"></p><button onclick="alert('Демо: реальный заказ не отправлен')">Оформить демо-заказ</button> <button onclick="cart.close()">Закрыть</button></dialog><script>const catalogs=[[['Наушники',4990,'🎧'],['Смартфон',59990,'📱'],['Геймпад',5990,'🎮']],[['Худи',4990,'🧥'],['Футболка',2490,'👕'],['Кроссовки',8990,'👟']]];let shop=0,basket=[];function render(){products.innerHTML='';catalogs[shop].forEach((p,i)=>{if(!p[0].toLowerCase().includes(search.value.toLowerCase()))return;products.innerHTML+=`<article><span>${p[2]}</span><h2>${p[0]}</h2><p>${p[1].toLocaleString('ru')} ₽</p><button onclick="add(${i})">В корзину</button></article>`})}function add(i){basket.push(catalogs[shop][i]);count.textContent=basket.length}function switchShop(){shop=1-shop;document.body.classList.toggle('fashion',!!shop);brand.textContent=shop?'Velaro':'TechStore';hero.textContent=shop?'Стиль без компромиссов.':'Техника для твоей жизни.';render()}function showCart(){items.innerHTML=basket.map((p,i)=>`<p>${p[0]} — ${p[1]} ₽ <button onclick="basket.splice(${i},1);count.textContent=basket.length;showCart()">Удалить</button></p>`).join('')||'Пусто';total.textContent='Итого: '+basket.reduce((a,p)=>a+p[1],0)+' ₽';if(!cart.open)cart.showModal()}render()</script></html>
